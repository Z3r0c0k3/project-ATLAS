services:
  backend:
    build:
      context: ./backend
    environment:
      PUBLIC_FRONTEND_BASE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./sample:/app/sample:ro
      - ./manual:/app/manual:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
