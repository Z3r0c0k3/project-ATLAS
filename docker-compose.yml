services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PUBLIC_FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_BASE_URL:-http://localhost:5173}
      ROOT_PATH: /api
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ATLAS_SECRET_KEY: ${ATLAS_SECRET_KEY:-atlas-local-development-only}
      ATLAS_LOGIN_PASSWORD: ${ATLAS_LOGIN_PASSWORD:-}
      ATLAS_MAX_UPLOAD_BYTES: ${ATLAS_MAX_UPLOAD_BYTES:-52428800}
      ATLAS_DEFAULT_LEDGER_SHEET_URL: ${ATLAS_DEFAULT_LEDGER_SHEET_URL:-}
      ATLAS_DEFAULT_DUES_LEDGER_SHEET_URL: ${ATLAS_DEFAULT_DUES_LEDGER_SHEET_URL:-}
      ATLAS_DEFAULT_MONTHLY_PUBLIC_SHEET_URL: ${ATLAS_DEFAULT_MONTHLY_PUBLIC_SHEET_URL:-}
      ATLAS_TEMPLATE_ROOT: /app/sample/동연-동아리_표준회계양식
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./sample:/app/sample:ro
      - ./manual:/app/manual:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
