services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PUBLIC_FRONTEND_BASE_URL: https://${ATLAS_DOMAIN:?ATLAS_DOMAIN is required}
      ROOT_PATH: ""
      CORS_ORIGINS: https://${ATLAS_DOMAIN:?ATLAS_DOMAIN is required}
      ATLAS_SECRET_KEY: ${ATLAS_SECRET_KEY:?ATLAS_SECRET_KEY is required}
      ATLAS_LOGIN_PASSWORD: ${ATLAS_LOGIN_PASSWORD:?ATLAS_LOGIN_PASSWORD is required}
      ATLAS_USER_ROLES: '${ATLAS_USER_ROLES:?ATLAS_USER_ROLES is required}'
      ATLAS_MAX_UPLOAD_BYTES: ${ATLAS_MAX_UPLOAD_BYTES:-52428800}
      ATLAS_DEFAULT_LEDGER_SHEET_URL: ${ATLAS_DEFAULT_LEDGER_SHEET_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./sample:/app/sample:ro
      - ./manual:/app/manual:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://${ATLAS_API_DOMAIN:?ATLAS_API_DOMAIN is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
